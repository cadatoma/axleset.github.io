:root{color-scheme:light dark;

*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:var(--ambar)}
.barra{border-bottom:1px solid var(--borde);background:var(--tarjeta)}
.barra div{max-width:44rem;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px}
.barra img{width:28px;height:28px;border-radius:7px}
.barra strong{font-size:17px}
.barra strong a{color:inherit;text-decoration:none}
.barra nav{margin-left:auto;display:flex;gap:16px;font-size:14px}
.barra nav a{text-decoration:none}
main{max-width:44rem;margin:0 auto;padding:2.2rem 1.25rem 4rem}
h1{font-size:2rem;line-height:1.15;letter-spacing:-.3px;margin:0 0 .5rem}
h2{font-size:1.2rem;margin:2.2rem 0 .5rem}
.sub{color:var(--suave);font-size:1.05rem;margin:0 0 1.6rem}
.caja{background:var(--ambar-suave);border-radius:12px;padding:1rem 1.2rem;margin:1.4rem 0}
.ticket{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:1.1rem 1.3rem;
  font-variant-numeric:tabular-nums;margin:1.4rem 0}
.ticket table{width:100%;border-collapse:collapse}
.ticket td{padding:.3rem 0}
.ticket td:last-child{text-align:right;font-weight:600}
.ticket .r{color:var(--rojo)} .ticket .v{color:var(--verde)}
.ticket .resp{border-top:1px solid var(--borde);margin-top:.6rem;padding-top:.7rem;font-size:1.15rem;font-weight:700}
ul{padding-left:1.2rem} li{margin:.4rem 0}
.suave{color:var(--suave);font-size:.9rem}
.pie{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--borde);color:var(--suave);font-size:.85rem}
.pie a{margin-right:14px}
.badge{display:inline-block;background:var(--tarjeta);border:1px solid var(--borde);border-radius:999px;
  padding:.3rem .8rem;font-size:.85rem;color:var(--suave);margin:.2rem .3rem .2rem 0}
